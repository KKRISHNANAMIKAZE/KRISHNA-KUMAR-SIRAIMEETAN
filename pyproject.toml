[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "numcompute"
version = "0.1.0"
description = "NumCompute toolkit and the numcompute_stream streaming decision-tree framework, built with NumPy"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "matplotlib"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
# Lets plain `pytest` find the packages in the project root
# (numcompute now, numcompute_stream for Assignment 2).
pythonpath = ["."]
testpaths = ["tests"]